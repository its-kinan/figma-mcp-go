<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>figma-mcp-go</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 12px;
        background: #1e1e1e;
        color: #e0e0e0;
        height: 100vh;
      }

      .container {
        display: flex;
        flex-direction: column;
        height: 100%;
        padding: 16px;
        gap: 12px;
      }

      .info-section {
        display: flex;
        flex-direction: column;
        gap: 8px;
        flex: 1;
      }

      .info-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .info-label { color: #888; }
      .info-value { color: #e0e0e0; font-weight: 500; }

      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .author {
        display: flex;
        align-items: center;
        gap: 6px;
        text-decoration: none;
        color: #888;
        font-size: 11px;
      }

      .author:hover { color: #e0e0e0; }

      .author img {
        width: 20px;
        height: 20px;
        border-radius: 50%;
      }

      .badge {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 12px;
        font-size: 11px;
        font-weight: 600;
      }

      .badge.connected    { background: #1a472a; color: #4ade80; }
      .badge.disconnected { background: #3a1a1a; color: #f87171; }

      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #f87171;
      }

      .dot.connected { background: #4ade80; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="info-section">
        <div class="info-row">
          <span class="info-label">Mode</span>
          <div style="display:flex;gap:4px;">
            <button type="button" id="btn-tunnel" style="background:#333;color:#eee;border:1px solid #555;border-radius:4px;padding:2px 8px;font-size:10px;cursor:pointer;">Tunnel (Direct)</button>
            <button type="button" id="btn-local" style="background:#222;color:#aaa;border:1px solid #444;border-radius:4px;padding:2px 8px;font-size:10px;cursor:pointer;">Localhost</button>
          </div>
        </div>
        <div class="info-row">
          <span class="info-label">Bridge</span>
          <input id="ws-url-input" type="text" style="background:#2a2a2a;color:#eee;border:1px solid #444;border-radius:4px;padding:2px 6px;font-size:11px;width:150px;font-family:inherit;" />
        </div>
        <div class="info-row">
          <span class="info-label">File</span>
          <span class="info-value" id="file-name">—</span>
        </div>
        <div class="info-row">
          <span class="info-label">Selection</span>
          <span class="info-value" id="selection-count">0 node(s)</span>
        </div>
      </div>
      <div class="footer">
        <a class="author" href="https://github.com/vkhanhqui/figma-mcp-go" target="_blank">
          <img src="https://avatars.githubusercontent.com/u/64468109?v=4" alt="avatar" />
          vkhanhqui
        </a>
        <div class="badge disconnected" id="status-badge">
          <span class="dot" id="dot"></span>
          <span id="badge-text">Disconnected</span>
        </div>
      </div>
    </div>
    <script>
      var TUNNEL_URL = "wss://joseph-cell-nerve-vertex.trycloudflare.com/ws";
      var LOCAL_URL = "ws://localhost:1994/ws";
      var DEFAULT_WS_URL = TUNNEL_URL;
      var WS_URL = DEFAULT_WS_URL;
      try {
        WS_URL = localStorage.getItem("figma_mcp_ws") || DEFAULT_WS_URL;
      } catch (e) {}
      var RECONNECT_DELAY_MS = 1500;

      var wsInput = document.getElementById("ws-url-input");
      var btnTunnel = document.getElementById("btn-tunnel");
      var btnLocal = document.getElementById("btn-local");

      function updateActiveBtn() {
        if (!btnTunnel || !btnLocal) return;
        var isLocal = WS_URL.indexOf("localhost") !== -1 || WS_URL.indexOf("127.0.0.1") !== -1;
        btnTunnel.style.background = isLocal ? "#222" : "#2563eb";
        btnTunnel.style.color = isLocal ? "#aaa" : "#fff";
        btnLocal.style.background = isLocal ? "#2563eb" : "#222";
        btnLocal.style.color = isLocal ? "#fff" : "#aaa";
      }

      function applyUrl(url) {
        if (WS_URL === url && socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) {
          return;
        }
        WS_URL = url;
        if (wsInput) wsInput.value = url;
        try {
          localStorage.setItem("figma_mcp_ws", url);
        } catch (e) {}
        updateActiveBtn();
        disconnect();
        connect();
      }

      if (btnTunnel) {
        btnTunnel.addEventListener("click", function () { applyUrl(TUNNEL_URL); });
      }
      if (btnLocal) {
        btnLocal.addEventListener("click", function () { applyUrl(LOCAL_URL); });
      }

      if (wsInput) {
        wsInput.value = WS_URL;
        updateActiveBtn();
        wsInput.addEventListener("change", function () {
          applyUrl(wsInput.value.trim() || DEFAULT_WS_URL);
        });
        wsInput.addEventListener("keydown", function (e) {
          if (e.key === "Enter") {
            wsInput.blur();
          }
        });
      }

      var socket = null;
      var reconnectTimer = null;
      var isConnecting = false;

      function setConnected(state) {
        var dot = document.getElementById("dot");
        var badgeText = document.getElementById("badge-text");
        var badge = document.getElementById("status-badge");
        dot.className = state ? "dot connected" : "dot";
        badgeText.textContent = state ? "Connected" : "Disconnected";
        badge.className = state ? "badge connected" : "badge disconnected";
      }

      function setStatus(status) {
        document.getElementById("file-name").textContent = status.fileName;
        document.getElementById("selection-count").textContent = status.selectionCount + " node(s)";
      }

      function disconnect() {
        if (reconnectTimer !== null) {
          clearTimeout(reconnectTimer);
          reconnectTimer = null;
        }
        if (socket) {
          socket.onopen = null;
          socket.onclose = null;
          socket.onerror = null;
          socket.onmessage = null;
          try {
            socket.close(1000, "user_switch");
          } catch (e) {}
          socket = null;
        }
        isConnecting = false;
        setConnected(false);
      }

      function connect() {
        if (isConnecting) return;
        if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) {
          return;
        }

        disconnect();

        isConnecting = true;
        console.log("[Figma MCP] Connecting to " + WS_URL);
        try {
          socket = new WebSocket(WS_URL);
        } catch (err) {
          console.error("[Figma MCP] WebSocket init error:", err);
          isConnecting = false;
          setConnected(false);
          return;
        }

        socket.onopen = function () {
          isConnecting = false;
          console.log("[Figma MCP] Connected successfully to " + WS_URL);
          setConnected(true);
          parent.postMessage({ pluginMessage: { type: "ui-ready" } }, "*");
        };

        socket.onclose = function (e) {
          isConnecting = false;
          console.log("[Figma MCP] Socket closed: code=" + e.code + " reason=" + e.reason);
          setConnected(false);
          socket = null;

          // Never auto-reconnect on clean close (1000), replaced connection, or user switch!
          if (e.code === 1000 || e.reason === "replaced by new connection" || e.reason === "user_switch") {
            var badgeText = document.getElementById("badge-text");
            if (badgeText) badgeText.textContent = "Paused";
            return;
          }

          if (reconnectTimer === null) {
            reconnectTimer = setTimeout(function () {
              reconnectTimer = null;
              connect();
            }, RECONNECT_DELAY_MS);
          }
        };

        socket.onerror = function (e) {
          isConnecting = false;
          console.error("[Figma MCP] Socket error:", e);
          setConnected(false);
        };

        socket.onmessage = function (event) {
          try {
            var payload = JSON.parse(event.data);
            parent.postMessage({ pluginMessage: { type: "server-request", payload: payload } }, "*");
          } catch (e) {
            // ignore malformed frames
          }
        };
      }

      window.addEventListener("message", function (event) {
        var msg = event.data && event.data.pluginMessage;
        if (!msg) return;

        if (msg.type === "plugin-status") {
          setStatus(msg.payload);
          return;
        }

        if ("requestId" in msg) {
          if (socket && socket.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify(msg));
          }
        }
      });

      connect();
    </script>
  </body>
</html>
